<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PAC Media</title>
<meta name="description" content="PAC Media - A Digital Publishing Platform by Pigeon Advertising & Communications.">
<meta name="theme-color" content="#C8102E" id="metaTheme">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PAC Media">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
:root{--red:#C8102E;--ink:#141414;--muted:#6b6b6b;--line:#e7e7e7;--bg:#ffffff;--splash-w:327px;--splash-h:239px;--hub-w:260px;--mag-radius:16px;--mag-bw:2px;--mag-bc:#C8102E;--nav-h:58px;--foot-h:48px}
html{-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;letter-spacing:.01em}
img{max-width:100%;height:auto;display:block}
a{color:inherit;text-decoration:none}
button{font:inherit;cursor:pointer;-webkit-user-select:none;user-select:none}

/* Splash */
#splash{position:fixed;inset:0;background:var(--red);display:flex;align-items:center;justify-content:center;z-index:100;transition:opacity .55s ease}
#splash.gone{opacity:0;pointer-events:none}
#splashLogo{width:min(var(--splash-w),84vw);height:min(var(--splash-h),70vh);object-fit:contain;opacity:0}
#splashLogo.ready{opacity:1;animation:logoIn .45s ease}
@keyframes logoIn{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:scale(1)}}
#splashFooter{position:absolute;left:0;right:0;bottom:calc(14px + env(safe-area-inset-bottom,0px));text-align:center;color:#fff;font-size:11px;opacity:.92;padding:0 16px;line-height:1.5;letter-spacing:.02em}

/* App shell */
#app{min-height:100dvh}
#view{animation:viewIn .3s ease}
@keyframes viewIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
#view{padding-bottom:calc(var(--nav-h) + var(--foot-h) + 16px + env(safe-area-inset-bottom,0px))}
body.readerview #view{padding-bottom:0}
footer.pagefoot{position:fixed;left:0;right:0;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px));background:#fff;border-top:1px solid var(--line);text-align:center;font-size:11px;color:var(--muted);padding:8px 16px;line-height:1.5;z-index:49;letter-spacing:.02em}

/* Red accent dash under logos */
.reddash{width:42px;height:4px;background:var(--red);border-radius:2px;margin:10px auto 0}

/* Red strip with small square logo (inside pages) */
.redstrip{background:var(--red);min-height:56px;padding:12px;display:flex;align-items:center;justify-content:center}
.strip-logo{height:44px;width:auto;max-width:70vw;object-fit:contain}

/* Hub */
.stack{display:flex;flex-direction:column;align-items:center;gap:30px;padding:44px 22px 10px;max-width:680px;margin:0 auto}
.hub-logo{display:block}
.hub-logo:active{opacity:1}
.mag-tile{display:flex;align-items:center;justify-content:center;border-radius:var(--mag-radius);border:var(--mag-bw) solid var(--mag-bc);padding:26px 30px;min-height:104px;transition:transform .15s ease,opacity .15s ease}
.hub-logo:active .mag-tile{transform:scale(.98);opacity:.92}
.mag-tile img{width:min(var(--hub-w),68vw);height:auto}
.tile-name{color:var(--red);font-weight:800;letter-spacing:.14em;text-transform:uppercase;font-size:16px;text-align:center;line-height:1.4}

/* Bottom nav */
#bottomNav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:center;gap:56px;padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));z-index:50;box-shadow:0 -6px 20px rgba(0,0,0,.06)}
.navitem{display:flex;flex-direction:column;align-items:center;gap:3px;color:#9a9a9a;font-size:11px;font-weight:600;min-width:64px;transition:color .15s ease}
.navitem.active{color:var(--red)}
.navitem svg{width:22px;height:22px}

/* Cards & wrap */
.card{background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 1px 3px rgba(16,16,16,.06),0 4px 14px rgba(16,16,16,.04)}
.wrap{max-width:680px;margin:0 auto;padding:0 20px}

/* Magazine page */
.mag-head{text-align:center;padding:32px 20px 4px}
.mag-head-tile{padding:22px 28px}
.mag-head .mag-tile img{width:min(var(--hub-w),66vw)}
.mag-name{font-size:12px;letter-spacing:.18em;color:var(--muted);text-transform:uppercase;margin-top:16px;font-weight:600}
.issues{display:flex;flex-direction:column;gap:18px;padding:26px 20px 0;max-width:560px;margin:0 auto}

/* Issue card: cover image on top (uncropped), title below */
.issue-card{position:relative;display:block;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#fff;box-shadow:0 1px 3px rgba(16,16,16,.06),0 4px 14px rgba(16,16,16,.04);transition:transform .15s ease}
.issue-card:active{transform:scale(.99)}
.issue-cover{background:#f4f4f4;display:flex;align-items:center;justify-content:center}
.issue-cover img{width:100%;height:auto;object-fit:contain}
.issue-cover .noimg{padding:44px 12px;color:#adadad;font-size:12px;letter-spacing:.1em;text-transform:uppercase}
.issue-meta{padding:12px 16px 14px}
.issue-title{font-weight:700;font-size:15px;line-height:1.35}
.issue-read{color:var(--red);font-size:11px;font-weight:800;margin-top:6px;letter-spacing:.12em}
.draft-badge{position:absolute;top:8px;right:8px;background:#111;color:#fff;font-size:10px;padding:3px 8px;border-radius:99px;letter-spacing:.06em}

/* Reader: the flipbook takes the WHOLE screen, exactly like the source site */
body.readerview{overflow:hidden}
body.readerview footer.pagefoot{display:none!important}
body.readerview #bottomNav{display:none!important}
.reader{position:fixed;inset:0;z-index:70;background:#141414;display:flex;flex-direction:column}
.reader-pill{position:absolute;z-index:6;display:flex;align-items:center;gap:5px;background:rgba(255,255,255,.94);color:var(--red);font-weight:700;font-size:13px;padding:9px 14px;border-radius:99px;box-shadow:0 2px 10px rgba(0,0,0,.25);white-space:nowrap;transition:transform .12s ease}
.reader-pill:active{transform:scale(.96)}
.reader-back{top:calc(10px + env(safe-area-inset-top,0px));left:10px}
.reader-open{top:calc(10px + env(safe-area-inset-top,0px));right:10px}
.reader-frame{position:relative;flex:1;min-height:0}
.reader-frame iframe{width:100%;height:100%;border:0;background:#141414}
.frame-loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#e8e8e8;font-size:13px;background:#141414}
.frame-hint{position:absolute;left:16px;right:16px;bottom:14px;padding:10px 12px;background:#fff7f7;border:1px solid var(--red);color:var(--ink);font-size:12px;border-radius:10px;line-height:1.5}

/* Admin */
.adminbox{max-width:440px;margin:40px auto;padding:0 20px}
.admin-card{border:1px solid var(--line);border-radius:16px;padding:24px;background:#fff;box-shadow:0 1px 3px rgba(16,16,16,.06),0 4px 14px rgba(16,16,16,.04)}
.admin-card h2{font-size:18px;margin-bottom:4px;font-weight:800}
.admin-card p.sub{color:var(--muted);font-size:13px;margin-bottom:14px;line-height:1.6}
label{display:block;font-size:12px;font-weight:700;color:#333;margin:14px 0 6px;letter-spacing:.02em}
input[type=text],input[type=email],input[type=password],input[type=number],input[type=url],textarea{width:100%;padding:11px 12px;border:1px solid #d6d6d6;border-radius:10px;font-size:14px;background:#fff;font-family:inherit;transition:border-color .15s ease}
input:focus,textarea:focus{outline:2px solid var(--red);border-color:var(--red)}
.btn{display:inline-block;background:var(--red);color:#fff;border:0;border-radius:10px;padding:12px 18px;font-weight:700;font-size:14px;transition:transform .12s ease,opacity .12s ease}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.6;cursor:default;transform:none}
.btn.block{width:100%}
.btn.ghost{background:#fff;color:var(--red);border:1.5px solid var(--red)}
.btn.small{padding:7px 12px;font-size:12px;border-radius:8px}
.btn.danger{background:#111}
.err{background:#fdecec;color:#8b1a1a;border:1px solid #f3b8b8;padding:10px 12px;border-radius:10px;font-size:13px;margin-top:12px;line-height:1.5}
.ok{background:#e9f7ef;color:#116636;border:1px solid #b5e2c6;padding:10px 12px;border-radius:10px;font-size:13px;margin-top:12px;line-height:1.5}

/* Dashboard */
.dashwrap{max-width:760px;margin:0 auto;padding:24px 18px 10px}
.dashhead{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.dashhead h1{font-size:20px;font-weight:800}
.tabs{display:flex;gap:10px;margin:18px 0}
.tab{padding:9px 16px;border-radius:99px;border:1.5px solid var(--line);font-weight:700;font-size:13px;background:#fff;color:#555;transition:border-color .15s ease,color .15s ease}
.tab.active{border-color:var(--red);color:var(--red)}
.rowitem{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid var(--line);border-radius:14px;margin-bottom:12px;background:#fff;box-shadow:0 1px 3px rgba(16,16,16,.05)}
.rowitem img.rthumb{width:56px;height:56px;object-fit:contain;border-radius:10px;background:#f4f4f4;flex:0 0 56px}
.rowitem .grow{flex:1;min-width:0}
.rowitem .rtitle{font-weight:700;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rowitem .rsub{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rowactions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.toggle{display:flex;align-items:center;gap:6px;font-size:12px;color:#555}
input[type=number].order{width:64px;padding:7px 8px;border:1px solid #d6d6d6;border-radius:8px;font-size:13px}
.formcard{border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:18px;background:#fff;box-shadow:0 1px 3px rgba(16,16,16,.06),0 4px 14px rgba(16,16,16,.04)}
.formcard h3{font-size:15px;margin-bottom:6px;font-weight:800}
.colorrow{display:flex;gap:12px;align-items:center}
input[type=color]{width:52px;height:40px;border:1px solid #d6d6d6;border-radius:8px;padding:2px;background:#fff}
.hint{font-size:12px;color:var(--muted);margin-top:6px;line-height:1.5}
.previewbox{margin-top:10px;border:1px dashed #d6d6d6;border-radius:10px;padding:12px;text-align:center;background:#fafafa}
.previewbox img{max-width:60%;margin:0 auto}
.previewbox.red{background:var(--red)}
.previewbox.red img{max-height:56px}
.nopreview{color:#999;font-size:12px;padding:8px 0}

/* Install banner */
#installBanner{position:fixed;left:14px;right:14px;bottom:calc(var(--nav-h) + var(--foot-h) + 14px + env(safe-area-inset-bottom,0px));background:var(--red);color:#fff;border-radius:14px;padding:14px 16px;display:flex;align-items:center;gap:12px;z-index:60;box-shadow:0 8px 24px rgba(0,0,0,.25)}
#installBanner .t{flex:1;font-size:13px;font-weight:600;line-height:1.4}
#installBanner .installbtn{background:#fff;color:var(--red);border:0;border-radius:99px;padding:9px 14px;font-weight:800;font-size:13px;white-space:nowrap}
#installBanner .dismiss{background:transparent;color:#fff;border:0;font-size:16px;opacity:.85;padding:4px}

/* Toast */
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav-h) + var(--foot-h) + 16px + env(safe-area-inset-bottom,0px));background:#111;color:#fff;padding:10px 16px;border-radius:99px;font-size:13px;z-index:80;max-width:88vw;text-align:center}

/* Modal (install steps) */
.modal-back{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:90;display:flex;align-items:center;justify-content:center;padding:20px}
.modal{background:#fff;border-radius:16px;max-width:400px;width:100%;padding:22px}
.modal h3{font-size:16px;margin-bottom:10px;font-weight:800}
.modal ol{padding-left:20px;font-size:14px;line-height:1.8}
.modal .btn{margin-top:16px}

/* Empty states */
.empty{max-width:520px;margin:46px auto;padding:0 20px;text-align:center}
.empty .card{padding:30px 22px}
.empty h3{font-size:16px;margin-bottom:8px;font-weight:800}
.empty p{font-size:13px;color:var(--muted);line-height:1.7}

@media (max-width:420px){
  #bottomNav{gap:40px}
}
</style>
</head>
<body>
<div id="splash" aria-hidden="true">
  <img id="splashLogo" alt="">
  <div id="splashFooter"></div>
</div>

<div id="app" hidden>
  <main id="view"></main>
  <footer class="pagefoot" id="pageFooter"></footer>
</div>

<nav id="bottomNav" hidden></nav>

<div id="installBanner" hidden>
  <div class="t" id="installText">Install PAC Media on your phone for one-tap reading.</div>
  <button class="installbtn" id="installBtn">Install</button>
  <button class="dismiss" id="installDismiss" aria-label="Close">&#10005;</button>
</div>

<div id="toast" hidden></div>

<script>
'use strict';
/* ================= PAC Media app ================= */
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const YEAR = new Date().getFullYear();

const DEFAULTS = {
  app_name: 'PAC Media',
  brand_red: '#C8102E',
  splash_logo_w: 327,
  splash_logo_h: 239,
  hub_logo_w: 260,
  logo_url: '',
  square_logo_url: '',
  mag_logo_radius: 16,
  mag_logo_border_w: 2,
  mag_logo_border_color: '#C8102E',
  footer_text: 'A Digital Publishing Platform by Pigeon Advertising & Communications.',
  admin_created: false,
  admin_user_id: null
};
let S = Object.assign({}, DEFAULTS);
let sb = null;
let session = null;
let deferPrompt = null;
let splashHidden = false;
let routeEpoch = 0;   // bumped on every route render; stale async renders bail out
let curMag = { id: null, name: '' };
const bind = (id, fn) => { const el = $(id); if (el) el.onclick = fn; };

const footerText = () => 'Copyright ' + YEAR + '. ' + (S.footer_text || DEFAULTS.footer_text);
const cfgReady = () => sb !== null;
const num = (v, def) => { const n = parseInt(v, 10); return isNaN(n) ? def : n; };
const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
const needsDbUpdate = (e) => /column/i.test((e && e.message) || String(e));
const dbUpdateHint = 'Run database-update.sql in the Supabase SQL Editor (README shows how), then try again.';

/* ---------- Supabase client ---------- */
(function initClient() {
  try {
    const u = typeof SUPABASE_URL === 'string' ? SUPABASE_URL.trim() : '';
    const k = typeof SUPABASE_ANON_KEY === 'string' ? SUPABASE_ANON_KEY.trim() : '';
    if (u && k && u.indexOf('PASTE-YOUR') === -1 && k.indexOf('PASTE-YOUR') === -1 && window.supabase && window.supabase.createClient) {
      sb = window.supabase.createClient(u, k);
    }
  } catch (e) { console.warn('Supabase init failed', e); }
})();

/* ---------- splash logo (the uploaded logo only, never a placeholder) ---------- */
let lastSplashUrl = null;
let splashLogoPromise = Promise.resolve();
function setSplashLogo(url) {
  if (url === lastSplashUrl) return splashLogoPromise;
  lastSplashUrl = url;
  const img = $('splashLogo');
  if (!url) { splashLogoPromise = Promise.resolve(); return splashLogoPromise; }  // stay hidden on red
  // Load the real logo fully BEFORE revealing anything. There is no
  // built-in fallback anymore: nothing shows until the real logo is ready.
  splashLogoPromise = new Promise((res) => {
    const probe = new Image();
    probe.onload = () => { img.src = url; img.classList.add('ready'); res(); };
    probe.onerror = () => res();
    probe.src = url;
  });
  return splashLogoPromise;
}

/* ---------- branding cache (kills the mid-splash logo resize glitch) ---------- */
const BRANDING_KEY = 'pacBranding';
function cacheBranding() {
  try { localStorage.setItem(BRANDING_KEY, JSON.stringify(S)); } catch (e) { /* ignore */ }
}
function loadCachedBranding() {
  try {
    const c = localStorage.getItem(BRANDING_KEY);
    if (c) {
      const o = JSON.parse(c);
      if (o && typeof o === 'object') { S = Object.assign({}, DEFAULTS, o); return; }
    }
    const legacy = localStorage.getItem('pacLogoUrl');  // pre-v4 cache
    if (legacy) S.logo_url = legacy;
  } catch (e) { /* ignore */ }
}

/* ---------- theme / footer ---------- */
function applyTheme() {
  const root = document.documentElement;
  root.style.setProperty('--red', S.brand_red || DEFAULTS.brand_red);
  root.style.setProperty('--splash-w', (num(S.splash_logo_w, 327)) + 'px');
  root.style.setProperty('--splash-h', (num(S.splash_logo_h, 239)) + 'px');
  root.style.setProperty('--hub-w', (num(S.hub_logo_w, 260)) + 'px');
  root.style.setProperty('--mag-radius', clamp(num(S.mag_logo_radius, 16), 0, 80) + 'px');
  root.style.setProperty('--mag-bw', clamp(num(S.mag_logo_border_w, 2), 0, 12) + 'px');
  root.style.setProperty('--mag-bc', S.mag_logo_border_color || DEFAULTS.mag_logo_border_color);
  const m = $('metaTheme'); if (m) m.content = S.brand_red || DEFAULTS.brand_red;
  document.title = S.app_name || 'PAC Media';
  setSplashLogo(S.logo_url || '');
  $('splashFooter').textContent = footerText();
  $('pageFooter').textContent = footerText();
  cacheBranding();
}
function squareLogoSrc() { return S.square_logo_url || S.logo_url || ''; }
function squareLogoHTML() {
  return squareLogoSrc() ? '<img class="strip-logo" src="' + esc(squareLogoSrc()) + '" alt="">' : '';
}

/* ---------- toast ---------- */
let toastTimer = null;
function toast(msg) {
  const t = $('toast'); t.textContent = msg; t.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.hidden = true; }, 3400);
}

/* ---------- boot (splash -> app) ---------- */
async function boot() {
  const t0 = Date.now();
  // Restore last-known branding synchronously, so the very first paint
  // already uses the final logo size (no resize glitch mid-splash).
  loadCachedBranding();
  applyTheme();
  let ok = false;
  try {
    if (sb) {
      const res = await sb.from('app_settings').select('*').eq('id', 1).maybeSingle();
      if (res.data) S = Object.assign({}, DEFAULTS, res.data);
      const ses = await sb.auth.getSession();
      session = (ses.data && ses.data.session) || null;
      ok = true;
    }
  } catch (e) { console.warn('boot data load failed', e); }
  applyTheme();  // also refreshes the branding cache
  try { await splashLogoPromise; } catch (e) { /* ignore */ }
  await sleep(Math.max(0, 1700 - (Date.now() - t0)));  // splash every launch, ~1.7s
  $('splash').classList.add('gone');
  setTimeout(() => { $('splash').style.display = 'none'; }, 600);
  $('app').hidden = false;
  $('bottomNav').hidden = false;
  splashHidden = true;
  route();
  maybeShowInstall();
  if (sb) {
    sb.auth.onAuthStateChange((_ev, s) => { session = s; renderNav(); route(); });
  }
}

/* ---------- router ---------- */
window.addEventListener('hashchange', route);

function route() {
  if (!splashHidden) return;
  const myEpoch = ++routeEpoch;
  const h = location.hash.replace(/^#\/?/, '');
  const parts = h.split('/').filter(Boolean).map(decodeURIComponent);
  const view = $('view');
  let after = null;
  document.body.classList.toggle('readerview', parts[0] === 'read');
  if (parts[0] === 'pac-admin') {
    view.innerHTML = stripHTML() + '<div id="adminGate"></div>';
    after = renderAdminGate;
  } else if (parts[0] === 'dashboard') {
    if (!session) { location.hash = '#/pac-admin'; return; }
    view.innerHTML = stripHTML() + '<div class="dashwrap" id="dash"></div>';
    after = renderDashboard;
  } else if (parts[0] === 'magazine' && parts[1]) {
    view.innerHTML = '<div id="mag"></div>';
    after = (ep) => renderMagazine(parts[1], ep);
  } else if (parts[0] === 'read' && parts[1]) {
    view.innerHTML = '<div id="reader"></div>';
    after = (ep) => renderReader(parts[1], ep);
  } else {
    view.innerHTML = '<div id="hub"></div>';
    after = renderHub;
  }
  renderNav(parts[0] || '');
  if (after) after(myEpoch);
  view.style.animation = 'none';
  void view.offsetHeight;  // restart the screen fade-in
  view.style.animation = '';
  window.scrollTo(0, 0);
  $('pageFooter').textContent = footerText();
}

/* ---------- swipe navigation (screens without a back button) ---------- */
let swX = 0, swY = 0, swT = 0;
document.addEventListener('touchstart', (e) => {
  if (e.touches.length !== 1) { swT = 0; return; }
  const t = e.changedTouches[0];
  swX = t.clientX; swY = t.clientY; swT = Date.now();
}, { passive: true });
document.addEventListener('touchend', (e) => {
  if (!swT || !splashHidden) return;
  const t = e.changedTouches[0];
  const dx = t.clientX - swX, dy = t.clientY - swY, dt = Date.now() - swT;
  swT = 0;
  if (dt > 700 || Math.abs(dx) < 72 || Math.abs(dy) > 56) return;
  if (Math.abs(dx) < Math.abs(dy) * 1.5) return;  // must be a clearly horizontal swipe
  if (e.target && e.target.closest && e.target.closest('input,textarea,select,[contenteditable]')) return;
  if (dx > 0) { if (history.length > 1) history.back(); }
  else { history.forward(); }
}, { passive: true });

function humanAuthError(e) {
  const m = (e && e.message) || String(e);

async function doSignup() {
  const email = $('suEmail').value.trim(), p1 = $('suPass').value, p2 = $('suPass2').value;
  if (!email || !p1 || !p2) return gateMsg('suMsg', 'err', 'Please fill in every field.');
  if (p1.length < 8) return gateMsg('suMsg', 'err', 'Password must be at least 8 characters.');
  if (p1 !== p2) return gateMsg('suMsg', 'err', 'The two passwords do not match.');
  $('suBtn').disabled = true; $('suBtn').textContent = 'Creating…';
  try {
    const r = await sb.auth.signUp({ email: email, password: p1 });
    if (r.error) throw r.error;
    if (!r.data.session) {
      gateMsg('suMsg', 'ok', 'Account created. Check your inbox for a confirmation email, then come back here and sign in.');
      $('suBtn').textContent = 'Check your email';
      return;
    }
    session = r.data.session;
    await finalizeSetup(false);
  } catch (e) {
    gateMsg('suMsg', 'err', humanAuthError(e));
    $('suBtn').disabled = false; $('suBtn').textContent = 'Create admin account';
  }
}

async function finalizeSetup(quiet) {
  try {
    const uid = session && session.user ? session.user.id : null;
    if (!uid) throw new Error('Not signed in.');
    const r = await sb.from('app_settings')
      .update({ admin_user_id: uid, admin_created: true, updated_at: new Date().toISOString() })
      .eq('id', 1).select().maybeSingle();
    if (r.error) throw r.error;
    if (r.data) S = Object.assign({}, DEFAULTS, r.data);
    if (!quiet) toast('Admin account ready');
    location.hash = '#/dashboard';
  } catch (e) { toast('Setup failed: ' + e.message); }
}

async function doLogin() {
  const email = $('liEmail').value.trim(), pass = $('liPass').value;
  if (!email || !pass) return gateMsg('liMsg', 'err', 'Please enter your email and password.');
  $('liBtn').disabled = true; $('liBtn').textContent = 'Signing in…';
  try {
    const r = await sb.auth.signInWithPassword({ email: email, password: pass });
    if (r.error) throw r.error;
    location.hash = '#/dashboard';
  } catch (e) {
    gateMsg('liMsg', 'err', humanAuthError(e));
    $('liBtn').disabled = false; $('liBtn').textContent = 'Sign in';
  }
}

async function doForgot() {
  const email = $('liEmail').value.trim();
  if (!email) return gateMsg('liMsg', 'err', 'Type your email first, then tap Forgot password.');
  try {

async function uploadImage(file, folder) {
  if (!file) return null;
  if (!file.type || file.type.indexOf('image/') !== 0) throw new Error('Please choose an image file (PNG or JPG).');
  if (file.size > 8 * 1024 * 1024) throw new Error('Image must be under 8 MB.');
  let ext = 'png';
  const dot = file.name.lastIndexOf('.');
  if (dot > -1) ext = file.name.slice(dot + 1).toLowerCase().replace(/[^a-z0-9]/g, '') || 'png';
  const path = folder + '/' + Date.now() + '-' + Math.random().toString(36).slice(2, 8) + '.' + ext;
  const up = await sb.storage.from('media').upload(path, file, { cacheControl: '3600' });
  if (up.error) {
    const msg = up.error.message || String(up.error);
    if (/bucket/i.test(msg)) throw new Error('Image storage is not ready (' + msg + '). Run database-update.sql in the Supabase SQL Editor (see README), then try again.');
    throw up.error;
  }
  const pub = sb.storage.from('media').getPublicUrl(path);
  return pub.data ? pub.data.publicUrl : null;
}

function slugify(name) {
  let s = String(name).toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
  return s || 'magazine';
}

      if (r.error) throw r.error;
      if (r.data) S = Object.assign({}, DEFAULTS, r.data);
      applyTheme(); route();
      gateMsg('brandMsg', 'ok', 'Saved.');
    } catch (e) { gateMsg('brandMsg', 'err', e.message); }
    $('saveBranding').disabled = false;
  };
  $('saveMagLogos').onclick = async () => {
    const patch = {
      hub_logo_w: clamp(num($('fHubW').value, 260), 80, 600),
      mag_logo_radius: clamp(num($('fMagR').value, 16), 0, 80),
      mag_logo_border_w: clamp(num($('fMagBW').value, 2), 0, 12),
      mag_logo_border_color: /^#[0-9a-fA-F]{6}$/.test($('fMagBCHex').value) ? $('fMagBCHex').value : S.mag_logo_border_color,
      updated_at: new Date().toISOString()
    };
    $('saveMagLogos').disabled = true;
    try {
      const r = await sb.from('app_settings').update(patch).eq('id', 1).select().maybeSingle();
      if (r.error) throw r.error;
      if (r.data) S = Object.assign({}, DEFAULTS, r.data);
      applyTheme(); route();
      gateMsg('magLogoMsg', 'ok', 'Saved.');
    } catch (e) {
      if (needsDbUpdate(e)) {
        try {
          const r2 = await sb.from('app_settings').update({ hub_logo_w: patch.hub_logo_w, updated_at: patch.updated_at }).eq('id', 1).select().maybeSingle();
          if (r2.error) throw r2.error;
          if (r2.data) S = Object.assign({}, DEFAULTS, r2.data);
          applyTheme(); route();
          gateMsg('magLogoMsg', 'err', 'Saved the logo width. The roundness and border options need the database update first: ' + dbUpdateHint);
        } catch (e2) { gateMsg('magLogoMsg', 'err', e2.message); }
      } else { gateMsg('magLogoMsg', 'err', e.message); }
    }
    $('saveMagLogos').disabled = false;
  };
  $('uploadLogo').onclick = async () => {
    const f = $('fLogo').files[0];
    if (!f) return gateMsg('logoMsg', 'err', 'Choose an image file first.');
    $('uploadLogo').disabled = true; $('uploadLogo').textContent = 'Uploading…';
    try {
      const url = await uploadImage(f, 'branding');
      if (!url) throw new Error('Upload failed.');
      const r = await sb.from('app_settings').update({ logo_url: url, updated_at: new Date().toISOString() }).eq('id', 1).select().maybeSingle();
      if (r.error) throw r.error;
      if (r.data) S = Object.assign({}, DEFAULTS, r.data);
      applyTheme();
      gateMsg('logoMsg', 'ok', 'Logo updated.');
      renderBrandingTab();
    } catch (e) { gateMsg('logoMsg', 'err', e.message); $('uploadLogo').disabled = false; $('uploadLogo').textContent = 'Upload logo'; }
  };
  $('uploadSqLogo').onclick = async () => {
    const f = $('fSqLogo').files[0];
    if (!f) return gateMsg('sqLogoMsg', 'err', 'Choose an image file first.');
    $('uploadSqLogo').disabled = true; $('uploadSqLogo').textContent = 'Uploading…';
    try {
      const url = await uploadImage(f, 'branding');
      if (!url) throw new Error('Upload failed.');
      const r = await sb.from('app_settings').update({ square_logo_url: url, updated_at: new Date().toISOString() }).eq('id', 1).select().maybeSingle();
      if (r.error) throw r.error;
      if (r.data) S = Object.assign({}, DEFAULTS, r.data);
      applyTheme();
      gateMsg('sqLogoMsg', 'ok', 'Square logo updated.');
      renderBrandingTab();
    } catch (e) {
      gateMsg('sqLogoMsg', 'err', needsDbUpdate(e) ? 'The database needs the square-logo column first: ' + dbUpdateHint : e.message);
      $('uploadSqLogo').disabled = false; $('uploadSqLogo').textContent = 'Upload square logo';
    }
  };
}
/* ---------- magazines tab ---------- */
async function renderMagsTab(epoch) {
  epoch = epoch || routeEpoch;
  const body = $('dashBody');
  body.innerHTML = '<div class="formcard"><h3>Your magazines</h3><div id="magList" class="hint">Loading&#8230;</div>' +
    '<button class="btn block" id="addMagBtn" style="margin-top:8px">+ Add magazine</button><div id="addMagForm"></div></div>';
  $('addMagBtn').onclick = showAddMagForm;
  try {
    const r = await sb.from('magazines').select('*').order('sort_order', { ascending: true }).order('created_at', { ascending: true });
    if (epoch !== routeEpoch || !document.getElementById('magList')) return;
    if (r.error) throw r.error;
    const mags = r.data || [];
    const list = $('magList');
    if (!mags.length) { list.className = ''; list.innerHTML = '<p class="hint" style="margin:6px 0 10px">No magazines yet. Add your first one below.</p>'; return; }
    list.className = '';
    list.innerHTML = mags.map((m) =>
      '<div class="rowitem">' +
      (m.logo_url ? '<img class="rthumb" src="' + esc(m.logo_url) + '" alt="">' : '<div class="rthumb" style="display:flex;align-items:center;justify-content:center;color:var(--red);font-weight:800;font-size:18px;background:#f4f4f4;border-radius:10px;width:56px;height:56px;flex:0 0 56px">' + esc((m.name || '?').charAt(0)) + '</div>') +
      '<div class="grow"><div class="rtitle">' + esc(m.name) + '</div><div class="rsub">/' + esc(m.slug) + '</div></div>' +
      '<div class="rowactions">' +
        '<label class="toggle"><input type="checkbox" class="pubToggle" data-id="' + m.id + '"' + (m.published ? ' checked' : '') + '> Live</label>' +
        '<input type="number" class="order" data-id="' + m.id + '" value="' + m.sort_order + '" title="Order">' +
        '<button class="btn small ghost" data-act="issues" data-id="' + m.id + '" data-name="' + esc(m.name) + '">Issues</button>' +
        '<button class="btn small ghost" data-act="edit" data-id="' + m.id + '">Edit</button>' +
        '<button class="btn small danger" data-act="del" data-id="' + m.id + '">Delete</button>' +
      '</div></div>').join('');
    list.querySelectorAll('.pubToggle').forEach((c) => { c.onchange = () => setMagPublished(c.dataset.id, c.checked); });
    list.querySelectorAll('.order').forEach((o) => {
      o.onchange = async () => {
        const v = parseInt(o.value, 10) || 0;
        const e2 = await sb.from('magazines').update({ sort_order: v }).eq('id', o.dataset.id);
        if (e2.error) toast(e2.message); else toast('Order saved.');
      };
    });
    list.querySelectorAll('button[data-act]').forEach((b) => {
      b.onclick = () => {
        if (b.dataset.act === 'issues') showIssuesManager(b.dataset.id, b.dataset.name);
        else if (b.dataset.act === 'edit') showEditMagForm(b.dataset.id, mags.find((x) => x.id === b.dataset.id));
        else deleteMagazine(b.dataset.id);
      };
    });
  } catch (e) {
    if (epoch !== routeEpoch) return;
    $('magList').innerHTML = '';
    $('magList').className = '';
    toast(e.message);
  }
}

function showAddMagForm() {
  $('addMagForm').innerHTML =
    '<div class="formcard" style="margin-top:14px"><h3>New magazine</h3>' +
    '<label>Magazine name</label><input type="text" id="nmName" placeholder="e.g. Pigeon Lifestyle">' +
    '<label>Logo (PNG recommended &#8212; it sits directly on the page)</label><input type="file" id="nmLogo" accept="image/*">' +
    '<label><span class="toggle" style="margin:0"><input type="checkbox" id="nmPub" checked> Visible to the public</span></label>' +
    '<button class="btn block" id="nmSave" style="margin-top:14px">Create magazine</button><div id="nmMsg"></div></div>';
  $('nmSave').onclick = createMagazine;
  $('nmSave').scrollIntoView({ behavior: 'smooth', block: 'center' });
}

async function createMagazine() {
  const name = $('nmName').value.trim();
  if (!name) return gateMsg('nmMsg', 'err', 'Please give the magazine a name.');
  $('nmSave').disabled = true; $('nmSave').textContent = 'Saving…';
  let logoUrl = null, logoErr = null;
  try {
    logoUrl = await uploadImage($('nmLogo').files[0], 'magazines');
  } catch (e) { logoErr = e.message; }
  try {
    let slug = slugify(name);
    let done = false;
    for (let i = 2; i < 8 && !done; i++) {
      const ins = await sb.from('magazines').insert({
        name: name, slug: slug, logo_url: logoUrl, published: $('nmPub').checked,
        sort_order: Date.now() % 100000
      }).select().maybeSingle();
      if (!ins.error) done = true;
      else if (/duplicate key|unique/i.test(ins.error.message)) slug = slugify(name) + '-' + i;
      else throw ins.error;
    }
    if (!done) throw new Error('Could not create a unique web address for this magazine. Try a slightly different name.');
    toast(logoErr ? 'Magazine created, but the logo failed to upload: ' + logoErr : 'Magazine created');
    renderMagsTab();
  } catch (e) { gateMsg('nmMsg', 'err', (logoErr ? 'Logo upload failed: ' + logoErr + '. ' : '') + e.message); $('nmSave').disabled = false; $('nmSave').textContent = 'Create magazine'; }
}

function showEditMagForm(id, m) {
  $('addMagForm').innerHTML =
    '<div class="formcard" style="margin-top:14px"><h3>Edit magazine</h3>' +
    '<label>Magazine name</label><input type="text" id="emName" value="' + esc(m.name) + '">' +
    '<label>Replace logo (optional)</label><input type="file" id="emLogo" accept="image/*">' +
    '<button class="btn block" id="emSave" style="margin-top:14px">Save changes</button><div id="emMsg"></div></div>';
  $('emSave').onclick = async () => {
    const name = $('emName').value.trim();
    if (!name) return gateMsg('emMsg', 'err', 'Name cannot be empty.');
    $('emSave').disabled = true; $('emSave').textContent = 'Saving…';
    try {
      let logoUrl = null, logoErr = null;
      if ($('emLogo').files[0]) {
        try { logoUrl = await uploadImage($('emLogo').files[0], 'magazines'); }
        catch (e) { logoErr = e.message; }
      }
      const patch = { name: name };
      if (logoUrl) patch.logo_url = logoUrl;
      const r = await sb.from('magazines').update(patch).eq('id', id);
      if (r.error) throw r.error;
      toast(logoErr ? 'Saved, but the logo failed to upload: ' + logoErr : 'Magazine updated');
      renderMagsTab();
    } catch (e) { gateMsg('emMsg', 'err', e.message); $('emSave').disabled = false; $('emSave').textContent = 'Save changes'; }
  };
  $('emSave').scrollIntoView({ behavior: 'smooth', block: 'center' });
}

async function setMagPublished(id, val) {
  const r = await sb.from('magazines').update({ published: !!val }).eq('id', id);
  if (r.error) toast(r.error.message); else toast(val ? 'Magazine is live.' : 'Magazine hidden from the public.');
}

async function deleteMagazine(id) {
  if (!confirm('Delete this magazine and ALL its issues? This cannot be undone.')) return;
  const r = await sb.from('magazines').delete().eq('id', id);
  if (r.error) toast(r.error.message); else { toast('Magazine deleted.'); renderMagsTab(); }
}
/* ---------- issues manager ---------- */
async function showIssuesManager(magId, magName, epoch) {
  epoch = epoch || routeEpoch;
  curMag = { id: magId, name: magName || curMag.name };
  const body = $('dashBody');
  body.innerHTML =
    '<div style="display:flex;align-items:center;gap:12px;margin-bottom:16px">' +
      '<button class="btn small ghost" id="backToMags">&larr; Magazines</button>' +
      '<h2 style="font-size:17px">Issues of ' + esc(magName || curMag.name) + '</h2></div>' +
    '<div class="formcard"><div id="issueList" class="hint">Loading&#8230;</div>' +
      '<button class="btn block" id="addIssueBtn" style="margin-top:8px">+ Add issue</button><div id="addIssueForm"></div></div>';
  $('backToMags').onclick = () => renderMagsTab();
  $('addIssueBtn').onclick = () => showAddIssueForm(magId);
  try {
    const r = await sb.from('issues').select('*').eq('magazine_id', magId)
      .order('sort_order', { ascending: true }).order('created_at', { ascending: true });
    if (epoch !== routeEpoch || !document.getElementById('issueList')) return;
    if (r.error) throw r.error;
    const issues = r.data || [];
    const list = $('issueList');
    list.className = '';
    if (!issues.length) { list.innerHTML = '<p class="hint" style="margin:6px 0 10px">No issues yet. Add the first issue below.</p>'; return; }
    list.innerHTML = issues.map((i) =>
      '<div class="rowitem">' +
      (i.thumbnail_url ? '<img class="rthumb" src="' + esc(i.thumbnail_url) + '" alt="">' : '<div style="width:56px;height:56px;border-radius:10px;background:#f4f4f4;flex:0 0 56px;display:flex;align-items:center;justify-content:center;color:#bbb;font-size:10px;letter-spacing:.06em">NO COVER</div>') +
      '<div class="grow"><div class="rtitle">' + esc(i.title) + '</div><div class="rsub">' + esc(i.flipbook_url || 'No flipbook link yet') + '</div></div>' +
      '<div class="rowactions">' +
        '<label class="toggle"><input type="checkbox" class="ipubToggle" data-id="' + i.id + '"' + (i.published ? ' checked' : '') + '> Live</label>' +
        '<input type="number" class="order" data-iid="' + i.id + '" value="' + i.sort_order + '" title="Order">' +
        '<button class="btn small ghost" data-act="edit" data-id="' + i.id + '">Edit</button>' +
        '<button class="btn small danger" data-act="del" data-id="' + i.id + '">Delete</button>' +
      '</div></div>').join('');
    list.querySelectorAll('.ipubToggle').forEach((c) => {
      c.onchange = async () => {
        const e2 = await sb.from('issues').update({ published: c.checked }).eq('id', c.dataset.id);
        if (e2.error) toast(e2.error.message); else toast(c.checked ? 'Issue is live.' : 'Issue hidden from the public.');
      };
    });
    list.querySelectorAll('.order').forEach((o) => {
      o.onchange = async () => {
        const e2 = await sb.from('issues').update({ sort_order: parseInt(o.value, 10) || 0 }).eq('id', o.dataset.iid);
        if (e2.error) toast(e2.error.message); else toast('Order saved.');
      };
    });
    list.querySelectorAll('button[data-act]').forEach((b) => {
      b.onclick = () => {
        const iss = issues.find((x) => x.id === b.dataset.id);
        if (b.dataset.act === 'edit') showEditIssueForm(magId, iss);
        else deleteIssue(magId, b.dataset.id);
      };
    });
  } catch (e) { if (epoch === routeEpoch && $('issueList')) $('issueList').textContent = e.message; }
}

function showAddIssueForm(magId) {
  $('addIssueForm').innerHTML =
    '<div class="formcard" style="margin-top:14px"><h3>New issue</h3>' +
    '<label>Issue title</label><input type="text" id="niTitle" placeholder="e.g. January 2026 Edition">' +
    '<label>Cover image (shown above the issue name; not cropped)</label><input type="file" id="niThumb" accept="image/*">' +
    '<label>Flipbook link</label><input type="url" id="niUrl" placeholder="https://...">' +
    '<div class="hint">Paste the public link of the online flipbook for this issue. Use an https:// link (https links protect your readers).</div>' +
    '<label><span class="toggle" style="margin:0"><input type="checkbox" id="niPub" checked> Visible to the public</span></label>' +
    '<button class="btn block" id="niSave" style="margin-top:14px">Publish issue</button><div id="niMsg"></div></div>';
  $('niSave').onclick = () => createIssue(magId);
  $('niSave').scrollIntoView({ behavior: 'smooth', block: 'center' });
}

async function createIssue(magId) {
  const title = $('niTitle').value.trim();
  const url = $('niUrl').value.trim();
  if (!title) return gateMsg('niMsg', 'err', 'Please give the issue a title.');
  if (!url) return gateMsg('niMsg', 'err', 'Please paste the flipbook link.');
  if (!/^https?:\/\//i.test(url)) return gateMsg('niMsg', 'err', 'The flipbook link must start with http:// or https://');
  $('niSave').disabled = true; $('niSave').textContent = 'Saving…';
  let thumbUrl = null, thumbErr = null;
  try {
    thumbUrl = await uploadImage($('niThumb').files[0], 'issues');
  } catch (e) { thumbErr = e.message; }
  try {
    const ins = await sb.from('issues').insert({
      magazine_id: magId, title: title, thumbnail_url: thumbUrl, flipbook_url: url,
      published: $('niPub').checked, sort_order: Date.now() % 100000
    });
    if (ins.error) throw ins.error;
    if (thumbErr) {
      gateMsg('niMsg', 'err', 'Issue saved, but the cover image failed to upload: ' + thumbErr + ' You can tap Edit on the issue later to add the image.');
      $('niSave').disabled = false; $('niSave').textContent = 'Publish issue';
    } else {
      toast('Issue published');
      showIssuesManager(magId, curMag.name);
    }
  } catch (e) { gateMsg('niMsg', 'err', (thumbErr ? 'Image upload failed: ' + thumbErr + '. ' : '') + e.message); $('niSave').disabled = false; $('niSave').textContent = 'Publish issue'; }
}

function showEditIssueForm(magId, iss) {
  $('addIssueForm').innerHTML =
    '<div class="formcard" style="margin-top:14px"><h3>Edit issue</h3>' +
    (iss.thumbnail_url ? '<div class="previewbox"><img src="' + esc(iss.thumbnail_url) + '" style="max-width:40%" alt="cover"></div>' : '') +
    '<label>Issue title</label><input type="text" id="eiTitle" value="' + esc(iss.title) + '">' +
    '<label>Replace cover image (optional)</label><input type="file" id="eiThumb" accept="image/*">' +
    '<label>Flipbook link</label><input type="url" id="eiUrl" value="' + esc(iss.flipbook_url) + '">' +
    '<button class="btn block" id="eiSave" style="margin-top:14px">Save changes</button><div id="eiMsg"></div></div>';
  $('eiSave').onclick = async () => {
    const title = $('eiTitle').value.trim();
    const url = $('eiUrl').value.trim();
    if (!title || !url) return gateMsg('eiMsg', 'err', 'Title and flipbook link are required.');
    $('eiSave').disabled = true; $('eiSave').textContent = 'Saving…';
    try {
      let thumbUrl = null, thumbErr = null;
      if ($('eiThumb').files[0]) {
        try { thumbUrl = await uploadImage($('eiThumb').files[0], 'issues'); }
        catch (e) { thumbErr = e.message; }
      }
      const patch = { title: title, flipbook_url: url };
      if (thumbUrl) patch.thumbnail_url = thumbUrl;
      const r = await sb.from('issues').update(patch).eq('id', iss.id);
      if (r.error) throw r.error;
      if (thumbErr) {
        gateMsg('eiMsg', 'err', 'Saved, but the new image failed to upload: ' + thumbErr);
        $('eiSave').disabled = false; $('eiSave').textContent = 'Save changes';
      } else {
        toast('Issue updated');
        showIssuesManager(magId, curMag.name);
      }
    } catch (e) { gateMsg('eiMsg', 'err', e.message); $('eiSave').disabled = false; $('eiSave').textContent = 'Save changes'; }
  };
  $('eiSave').scrollIntoView({ behavior: 'smooth', block: 'center' });
}

async function deleteIssue(magId, id) {
  if (!confirm('Delete this issue? This cannot be undone.')) return;
  const r = await sb.from('issues').delete().eq('id', id);
  if (r.error) toast(r.error.message); else { toast('Issue deleted.'); showIssuesManager(magId, curMag.name); }
}

function currentMagName() { return curMag.name; }

/* ---------- install banner (Android native + iOS guide) ---------- */
function isStandalone() {
  if (window.navigator.standalone === true) return true;
  const mm = window.matchMedia;
  if (!mm) return false;
  return mm('(display-mode: standalone)').matches ||
         mm('(display-mode: fullscreen)').matches ||
         mm('(display-mode: minimal-ui)').matches;
}
function isIOS() {
  return /iphone|ipad|ipod/i.test(window.navigator.userAgent);
}
function installDismissedThisSession() {
  try { return sessionStorage.getItem('pacInstallDismissed') === '1'; } catch (e) { return false; }
}
function maybeShowInstall() {
  // Running as the installed app: never show (that is what the app is for).
  if (isStandalone()) { $('installBanner').hidden = true; return; }
  // In a normal browser the install offer appears on every visit until
  // it is installed, or closed for the current visit with the X button.
  $('installBanner').hidden = true;
  if (installDismissedThisSession()) return;
  if (isIOS()) {
    $('installText').textContent = 'Add PAC Media to your home screen: tap the Share button, then "Add to Home Screen".';
    $('installBtn').textContent = 'How';
    $('installBtn').onclick = showInstallHelp;
    $('installBanner').hidden = false;
    return;
  }
  if (deferPrompt) {
    $('installText').textContent = 'Install PAC Media on your phone for one-tap reading.';
    $('installBtn').textContent = 'Install';
    $('installBtn').onclick = async () => {
      $('installBanner').hidden = true;
      if (!deferPrompt) { showInstallHelp(); return; }
      const promptEvent = deferPrompt; deferPrompt = null;
      try { promptEvent.prompt(); } catch (e) { showInstallHelp(); }
    };
    $('installBanner').hidden = false;
    return;
  }
  // No native install prompt available: on phones offer the manual
  // steps instead of a button that would do nothing. On desktop stay quiet.
  if (window.matchMedia && window.matchMedia('(max-width: 820px)').matches) {
    $('installText').textContent = 'Add PAC Media to your home screen for one-tap reading.';
    $('installBtn').textContent = 'How';
    $('installBtn').onclick = showInstallHelp;
    $('installBanner').hidden = false;
  }
}
function showInstallHelp() {
  const back = document.createElement('div');
  back.className = 'modal-back';
  back.innerHTML =
    '<div class="modal"><h3>Install PAC Media</h3>' +
    '<ol><li><b>Android (Chrome):</b> tap the &#8942; menu and choose <b>Install app</b> or <b>Add to Home screen</b>.</li>' +
    '<li><b>iPhone / iPad (Safari):</b> tap the <b>Share</b> button, then <b>Add to Home Screen</b>.</li></ol>' +
    '<p class="hint" style="margin-top:10px">The PAC Media icon appears on your home screen and opens as its own app.</p>' +
    '<button class="btn block" id="installHelpClose">Got it</button></div>';
  back.querySelector('#installHelpClose').onclick = () => back.remove();
  document.body.appendChild(back);
}
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferPrompt = e;
  if (splashHidden && !isStandalone() && !installDismissedThisSession() && !isIOS()) maybeShowInstall();
});
window.addEventListener('appinstalled', () => {
  $('installBanner').hidden = true;
});
$('installDismiss').onclick = () => {
  $('installBanner').hidden = true;
  // Session only: closed for now, offered again on the next visit.
  try { sessionStorage.setItem('pacInstallDismissed', '1'); } catch (e) { /* ignore */ }
};

/* ---------- service worker ---------- */
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')) {
  navigator.serviceWorker.register('sw.js').catch((e) => console.warn('SW register failed', e));
}

/* ---------- go ---------- */
boot();
</script>
